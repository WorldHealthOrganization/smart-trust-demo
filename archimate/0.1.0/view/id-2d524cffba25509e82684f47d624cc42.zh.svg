<g class="av-legend"><rect x="14" y="360" width="829" height="284" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="378">键</text><text class="av-keyh" x="24" y="394">颜色：框属于架构的哪个部分</text><rect x="24" y="403" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="414">为何：谁关心（利益相关方），以及驱动因素、目标、成果、价值和要求</text><rect x="24" y="423" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="434">战略：组织能够做什么（能力）以及凭借什么（资源、价值流）</text><rect x="24" y="443" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="454">业务：人员、角色和组织，他们执行的流程及使用的信息</text><text class="av-keyh" x="24" y="474">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><polygon points="30,482 62,482 68,488 68,500 62,506 30,506 24,500 24,488" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="498">切角：原因或目标，例如利益相关方、目标、成果或价值</text><rect x="24" y="512" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="528">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="24" y="542" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="558">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="24" y="584">其他标记</text><rect x="24" y="591" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="596" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="604">一个框位于另一个框内：是其组成部分</text><rect x="24" y="613" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="613" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="624">带深色标题的区带：仅用于布局的分组，不增加含义（按其中大多数框所属的层着色）</text></g></svg>
