<g class="av-legend"><rect x="254" y="533" width="829" height="334" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="264" y="551">Clé</text><text class="av-keyh" x="264" y="567">Couleur : la partie de l’architecture à laquelle appartient une boîte</text><rect x="264" y="576" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="322" y="587">Pourquoi : qui est concerné (parties prenantes), ainsi que les moteurs, buts, résultats, valeurs et exigences</text><rect x="264" y="596" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="322" y="607">Stratégie : ce que l’organisation est capable de faire (capacités) et avec quoi (ressources, chaînes de valeur)</text><rect x="264" y="616" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="322" y="627">Métier : les personnes, les rôles et les organisations, les processus qu’ils mènent et les informations qu’ils utilisent</text><rect x="264" y="636" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="322" y="647">Logiciel : les systèmes et leurs parties, les services qu’ils offrent et les données qu’ils détiennent</text><text class="av-keyh" x="264" y="667">Forme : le type de chose qu’est une boîte (sa petite étiquette en italique nomme le type exact)</text><polygon points="270,675 302,675 308,681 308,693 302,699 270,699 264,693 264,681" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="691">Coins coupés : une raison ou une finalité, comme une partie prenante, un but, un résultat ou une valeur</text><rect x="264" y="705" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="721">Coins arrondis : une action ou une aptitude, comme une capacité, un processus ou une fonction</text><rect x="264" y="735" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="751">Extrémités arrondies : un service, offert à l’usage d’autres</text><rect x="264" y="765" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="781">Coins droits : quelque chose qui existe, comme un système, un rôle ou une donnée</text><text class="av-keyh" x="264" y="807">Autres symboles</text><rect x="264" y="814" width="44" height="18" fill="#fff" stroke="#555"/><rect x="274" y="819" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="827">Une boîte dans une autre boîte : une partie de celle-ci</text><rect x="264" y="836" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="264" y="836" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="322" y="847">Bande à en-tête sombre : un regroupement pour la mise en page uniquement ; il n’ajoute aucune signification (teinté selon la couche à laquelle appartiennent la plupart de ses boîtes)</text></g></svg>
