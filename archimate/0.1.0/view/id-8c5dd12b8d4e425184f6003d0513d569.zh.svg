<g class="av-legend"><rect x="194" y="947" width="705" height="424" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="204" y="965">键</text><text class="av-keyh" x="204" y="981">颜色：框属于架构的哪个部分</text><rect x="204" y="990" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="262" y="1001">战略：组织能够做什么（能力）以及凭借什么（资源、价值流）</text><rect x="204" y="1010" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="262" y="1021">软件：系统及其部件、它们提供的服务以及保存的数据</text><rect x="204" y="1030" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="262" y="1041">技术：软件运行所依托的设备、平台和网络</text><text class="av-keyh" x="204" y="1061">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><rect x="204" y="1069" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1085">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="204" y="1099" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1115">圆端：服务，供他方使用</text><rect x="204" y="1129" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1145">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="204" y="1171">其他标记</text><rect x="204" y="1178" width="44" height="18" fill="#fff" stroke="#555"/><rect x="214" y="1183" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1191">一个框位于另一个框内：是其组成部分</text><text class="av-keyh" x="204" y="1211">线：两个框之间的关系，从线的起点读向终点</text><path d="M214 1227 L246 1227" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1231">实现：使之成为现实，或达成</text><path d="M214 1247 L246 1247" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="262" y="1251">服务：服务于（提供终点所需之物）</text><path d="M214 1267 L246 1267" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-filled)"/><text class="av-key" x="262" y="1271">组合：由……构成（终点是不能脱离起点而存在的组成部分）</text><path d="M214 1287 L246 1287" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-hollow)"/><text class="av-key" x="262" y="1291">聚合：归组（终点是可独立存在的组成部分）</text><path d="M214 1307 L246 1307" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="262" y="1311">访问：读取或写入数据（箭头表示数据流动的方向）</text><path d="M214 1327 L246 1327" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1331">特化：是……的一种</text><path d="M214 1347 L246 1347" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="262" y="1351">关联：与之相关（无更具体的含义）</text></g></svg>
