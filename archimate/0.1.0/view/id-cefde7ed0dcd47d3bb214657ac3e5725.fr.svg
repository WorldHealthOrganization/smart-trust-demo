<g class="av-legend"><rect x="614" y="461" width="705" height="274" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="624" y="479">Clé</text><text class="av-keyh" x="624" y="495">Couleur : la partie de l’architecture à laquelle appartient une boîte</text><rect x="624" y="504" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="682" y="515">Stratégie : ce que l’organisation est capable de faire (capacités) et avec quoi (ressources, chaînes de valeur)</text><rect x="624" y="524" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="682" y="535">Métier : les personnes, les rôles et les organisations, les processus qu’ils mènent et les informations qu’ils utilisent</text><rect x="624" y="544" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="682" y="555">Logiciel : les systèmes et leurs parties, les services qu’ils offrent et les données qu’ils détiennent</text><text class="av-keyh" x="624" y="575">Forme : le type de chose qu’est une boîte (sa petite étiquette en italique nomme le type exact)</text><rect x="624" y="583" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="599">Coins arrondis : une action ou une aptitude, comme une capacité, un processus ou une fonction</text><rect x="624" y="613" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="629">Coins droits : quelque chose qui existe, comme un système, un rôle ou une donnée</text><text class="av-keyh" x="624" y="655">Ligne : la relation entre deux boîtes, lue depuis le début de la ligne jusqu’à sa fin</text><path d="M634 671 L666 671" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="682" y="675">Réalisation : rend réel, ou atteint</text><path d="M634 691 L666 691" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="682" y="695">Accès : lit ou écrit des données (la flèche indique le sens de circulation des données)</text><path d="M634 711 L666 711" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="682" y="715">Association : est lié à (sans signification plus précise)</text></g></svg>
