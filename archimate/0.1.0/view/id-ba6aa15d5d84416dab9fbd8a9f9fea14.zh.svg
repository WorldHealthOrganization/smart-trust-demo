<g class="av-legend"><rect x="230" y="575" width="698" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="240" y="593">键</text><text class="av-keyh" x="240" y="609">颜色：框属于架构的哪个部分</text><rect x="240" y="618" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="298" y="629">业务：人员、角色和组织，他们执行的流程及使用的信息</text><rect x="240" y="638" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="298" y="649">软件：系统及其部件、它们提供的服务以及保存的数据</text><text class="av-keyh" x="240" y="669">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><rect x="240" y="677" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="693">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="240" y="707" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="723">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="240" y="749">其他标记</text><rect x="240" y="756" width="44" height="18" fill="#fff" stroke="#555"/><rect x="250" y="761" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="769">一个框位于另一个框内：是其组成部分</text><text class="av-keyh" x="240" y="789">线：两个框之间的关系，从线的起点读向终点</text><path d="M250 805 L282 805" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="298" y="809">实现：使之成为现实，或达成</text><path d="M250 825 L282 825" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="298" y="829">服务：服务于（提供终点所需之物）</text><path d="M250 845 L282 845" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="849">分配：被分配给，或执行</text><path d="M250 865 L282 865" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="869">触发：触发（先发生，并启动终点）</text></g></svg>
