<g class="av-legend"><rect x="230" y="575" width="698" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="240" y="593">Clé</text><text class="av-keyh" x="240" y="609">Couleur : la partie de l’architecture à laquelle appartient une boîte</text><rect x="240" y="618" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="298" y="629">Métier : les personnes, les rôles et les organisations, les processus qu’ils mènent et les informations qu’ils utilisent</text><rect x="240" y="638" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="298" y="649">Logiciel : les systèmes et leurs parties, les services qu’ils offrent et les données qu’ils détiennent</text><text class="av-keyh" x="240" y="669">Forme : le type de chose qu’est une boîte (sa petite étiquette en italique nomme le type exact)</text><rect x="240" y="677" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="693">Coins arrondis : une action ou une aptitude, comme une capacité, un processus ou une fonction</text><rect x="240" y="707" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="723">Coins droits : quelque chose qui existe, comme un système, un rôle ou une donnée</text><text class="av-keyh" x="240" y="749">Autres symboles</text><rect x="240" y="756" width="44" height="18" fill="#fff" stroke="#555"/><rect x="250" y="761" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="769">Une boîte dans une autre boîte : une partie de celle-ci</text><text class="av-keyh" x="240" y="789">Ligne : la relation entre deux boîtes, lue depuis le début de la ligne jusqu’à sa fin</text><path d="M250 805 L282 805" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="298" y="809">Réalisation : rend réel, ou atteint</text><path d="M250 825 L282 825" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="298" y="829">Desserte : dessert (fournit ce dont l’extrémité a besoin)</text><path d="M250 845 L282 845" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="849">Affectation : est affecté à, ou exécute</text><path d="M250 865 L282 865" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="869">Déclenchement : déclenche (se produit d’abord, et lance l’extrémité)</text></g></svg>
