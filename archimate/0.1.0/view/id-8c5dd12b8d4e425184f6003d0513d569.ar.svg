<g class="av-legend"><rect x="194" y="947" width="705" height="424" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="204" y="965">المفتاح</text><text class="av-keyh" x="204" y="981">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="204" y="990" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="262" y="1001">الاستراتيجية: ما تستطيع المؤسسة فعله (القدرات) وبماذا (الموارد، وسلاسل القيمة)</text><rect x="204" y="1010" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="262" y="1021">البرمجيات: الأنظمة وأجزاؤها، والخدمات التي تقدّمها، والبيانات التي تحتفظ بها</text><rect x="204" y="1030" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="262" y="1041">التقنية: الأجهزة والمنصات والشبكات التي تعمل عليها البرمجيات</text><text class="av-keyh" x="204" y="1061">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><rect x="204" y="1069" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1085">الزوايا المستديرة: شيء يُنجَز أو قدرة، مثل القدرة أو العملية أو الوظيفة</text><rect x="204" y="1099" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1115">الأطراف المستديرة: خدمة مُقدَّمة ليستخدمها الآخرون</text><rect x="204" y="1129" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1145">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="204" y="1171">علامات أخرى</text><rect x="204" y="1178" width="44" height="18" fill="#fff" stroke="#555"/><rect x="214" y="1183" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1191">مربع داخل مربع آخر: جزء منه</text><text class="av-keyh" x="204" y="1211">الخط: كيف يرتبط مربعان، ويُقرأ من حيث يبدأ الخط إلى حيث ينتهي</text><path d="M214 1227 L246 1227" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1231">التحقيق: يجعله حقيقيًا، أو يحقّقه</text><path d="M214 1247 L246 1247" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="262" y="1251">الخدمة: يخدم (يوفّر ما يحتاجه الطرف)</text><path d="M214 1267 L246 1267" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-filled)"/><text class="av-key" x="262" y="1271">التركيب: يتركّب من (الطرف جزء لا يمكن أن يوجد دون البداية)</text><path d="M214 1287 L246 1287" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-hollow)"/><text class="av-key" x="262" y="1291">الضمّ: يجمع (الطرف جزء يمكن أن يوجد أيضًا بمفرده)</text><path d="M214 1307 L246 1307" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="262" y="1311">الوصول: يقرأ البيانات أو يكتبها (يُبيّن السهم اتجاه البيانات)</text><path d="M214 1327 L246 1327" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1331">التخصيص: نوع من</text><path d="M214 1347 L246 1347" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="262" y="1351">الارتباط: مرتبط به (دون معنى أكثر تحديدًا)</text></g></svg>
