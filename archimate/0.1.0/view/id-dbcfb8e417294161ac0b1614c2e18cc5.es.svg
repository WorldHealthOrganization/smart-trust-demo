<g class="av-legend"><rect x="254" y="851" width="705" height="344" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="264" y="869">Clave</text><text class="av-keyh" x="264" y="885">Color: a qué parte de la arquitectura pertenece una caja</text><rect x="264" y="894" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="322" y="905">Estrategia: lo que la organización es capaz de hacer (capacidades) y con qué (recursos, flujos de valor)</text><rect x="264" y="914" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="322" y="925">Negocio: personas, roles y organizaciones, los procesos que llevan a cabo y la información que usan</text><rect x="264" y="934" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="322" y="945">Software: los sistemas y sus partes, los servicios que ofrecen y los datos que guardan</text><text class="av-keyh" x="264" y="965">Forma: qué tipo de cosa es una caja (su pequeña etiqueta en cursiva nombra el tipo exacto)</text><rect x="264" y="973" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="989">Esquinas redondeadas: algo que se hace o una aptitud, como una capacidad, un proceso o una función</text><rect x="264" y="1003" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="1019">Extremos redondeados: un servicio, ofrecido para que otros lo usen</text><rect x="264" y="1033" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="1049">Esquinas rectas: algo que existe, como un sistema, un rol o un dato</text><text class="av-keyh" x="264" y="1075">Otras marcas</text><rect x="264" y="1082" width="44" height="18" fill="#fff" stroke="#555"/><rect x="274" y="1087" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="1095">Una caja dentro de otra caja: una parte de ella</text><text class="av-keyh" x="264" y="1115">Línea: cómo se relacionan dos cajas, leída desde donde empieza la línea hasta donde termina</text><path d="M274 1131 L306 1131" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="322" y="1135">Realización: hace real, o logra</text><path d="M274 1151 L306 1151" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="322" y="1155">Acceso: lee o escribe datos (la flecha indica en qué dirección van los datos)</text><path d="M274 1171 L306 1171" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="322" y="1175">Asociación: está relacionado con (sin un significado más específico)</text></g></svg>
