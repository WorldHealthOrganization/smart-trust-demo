<g class="av-legend"><rect x="254" y="533" width="829" height="334" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="264" y="551">Clave</text><text class="av-keyh" x="264" y="567">Color: a qué parte de la arquitectura pertenece una caja</text><rect x="264" y="576" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="322" y="587">Por qué: a quién le importa (partes interesadas), y los impulsores, metas, resultados, valores y requisitos</text><rect x="264" y="596" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="322" y="607">Estrategia: lo que la organización es capaz de hacer (capacidades) y con qué (recursos, flujos de valor)</text><rect x="264" y="616" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="322" y="627">Negocio: personas, roles y organizaciones, los procesos que llevan a cabo y la información que usan</text><rect x="264" y="636" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="322" y="647">Software: los sistemas y sus partes, los servicios que ofrecen y los datos que guardan</text><text class="av-keyh" x="264" y="667">Forma: qué tipo de cosa es una caja (su pequeña etiqueta en cursiva nombra el tipo exacto)</text><polygon points="270,675 302,675 308,681 308,693 302,699 270,699 264,693 264,681" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="691">Esquinas cortadas: un motivo o fin, como una parte interesada, una meta, un resultado o un valor</text><rect x="264" y="705" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="721">Esquinas redondeadas: algo que se hace o una aptitud, como una capacidad, un proceso o una función</text><rect x="264" y="735" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="751">Extremos redondeados: un servicio, ofrecido para que otros lo usen</text><rect x="264" y="765" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="781">Esquinas rectas: algo que existe, como un sistema, un rol o un dato</text><text class="av-keyh" x="264" y="807">Otras marcas</text><rect x="264" y="814" width="44" height="18" fill="#fff" stroke="#555"/><rect x="274" y="819" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="827">Una caja dentro de otra caja: una parte de ella</text><rect x="264" y="836" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="264" y="836" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="322" y="847">Banda con encabezado oscuro: una agrupación solo de diseño; no añade significado (teñida con el color de la capa a la que pertenecen la mayoría de sus cajas)</text></g></svg>
