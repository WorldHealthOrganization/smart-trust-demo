<g class="av-legend"><rect x="206" y="917" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="216" y="935">Clave</text><text class="av-keyh" x="216" y="951">Color: a qué parte de la arquitectura pertenece una caja</text><rect x="216" y="960" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="274" y="971">Por qué: a quién le importa (partes interesadas), y los impulsores, metas, resultados, valores y requisitos</text><rect x="216" y="980" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="274" y="991">Estrategia: lo que la organización es capaz de hacer (capacidades) y con qué (recursos, flujos de valor)</text><rect x="216" y="1000" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="274" y="1011">Negocio: personas, roles y organizaciones, los procesos que llevan a cabo y la información que usan</text><rect x="216" y="1020" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="274" y="1031">Software: los sistemas y sus partes, los servicios que ofrecen y los datos que guardan</text><rect x="216" y="1040" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="274" y="1051">Tecnología: los dispositivos, plataformas y redes en los que funciona el software</text><text class="av-keyh" x="216" y="1071">Forma: qué tipo de cosa es una caja (su pequeña etiqueta en cursiva nombra el tipo exacto)</text><polygon points="222,1079 254,1079 260,1085 260,1097 254,1103 222,1103 216,1097 216,1085" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1095">Esquinas cortadas: un motivo o fin, como una parte interesada, una meta, un resultado o un valor</text><rect x="216" y="1109" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1125">Esquinas redondeadas: algo que se hace o una aptitud, como una capacidad, un proceso o una función</text><rect x="216" y="1139" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1155">Extremos redondeados: un servicio, ofrecido para que otros lo usen</text><rect x="216" y="1169" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1185">Esquinas rectas: algo que existe, como un sistema, un rol o un dato</text><text class="av-keyh" x="216" y="1211">Otras marcas</text><rect x="216" y="1218" width="44" height="18" fill="#fff" stroke="#555"/><rect x="226" y="1223" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1231">Una caja dentro de otra caja: una parte de ella</text><rect x="216" y="1240" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="216" y="1240" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="274" y="1251">Banda con encabezado oscuro: una agrupación solo de diseño; no añade significado (teñida con el color de la capa a la que pertenecen la mayoría de sus cajas)</text></g></svg>
