<g class="av-legend"><rect x="14" y="360" width="829" height="284" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="378">Clave</text><text class="av-keyh" x="24" y="394">Color: a qué parte de la arquitectura pertenece una caja</text><rect x="24" y="403" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="414">Por qué: a quién le importa (partes interesadas), y los impulsores, metas, resultados, valores y requisitos</text><rect x="24" y="423" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="434">Estrategia: lo que la organización es capaz de hacer (capacidades) y con qué (recursos, flujos de valor)</text><rect x="24" y="443" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="454">Negocio: personas, roles y organizaciones, los procesos que llevan a cabo y la información que usan</text><text class="av-keyh" x="24" y="474">Forma: qué tipo de cosa es una caja (su pequeña etiqueta en cursiva nombra el tipo exacto)</text><polygon points="30,482 62,482 68,488 68,500 62,506 30,506 24,500 24,488" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="498">Esquinas cortadas: un motivo o fin, como una parte interesada, una meta, un resultado o un valor</text><rect x="24" y="512" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="528">Esquinas redondeadas: algo que se hace o una aptitud, como una capacidad, un proceso o una función</text><rect x="24" y="542" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="558">Esquinas rectas: algo que existe, como un sistema, un rol o un dato</text><text class="av-keyh" x="24" y="584">Otras marcas</text><rect x="24" y="591" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="596" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="604">Una caja dentro de otra caja: una parte de ella</text><rect x="24" y="613" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="613" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="624">Banda con encabezado oscuro: una agrupación solo de diseño; no añade significado (teñida con el color de la capa a la que pertenecen la mayoría de sus cajas)</text></g></svg>
