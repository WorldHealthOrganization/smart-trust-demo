<g class="av-legend"><rect x="14" y="561" width="829" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="579">المفتاح</text><text class="av-keyh" x="24" y="595">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="24" y="604" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="615">الأعمال: الأشخاص والأدوار والمؤسسات، والعمليات التي يؤدّونها والمعلومات التي يستخدمونها</text><rect x="24" y="624" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="635">البرمجيات: الأنظمة وأجزاؤها، والخدمات التي تقدّمها، والبيانات التي تحتفظ بها</text><text class="av-keyh" x="24" y="655">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><rect x="24" y="663" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="679">الأطراف المستديرة: خدمة مُقدَّمة ليستخدمها الآخرون</text><rect x="24" y="693" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="709">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="24" y="735">علامات أخرى</text><rect x="24" y="742" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="747" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="755">مربع داخل مربع آخر: جزء منه</text><rect x="24" y="764" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="764" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="775">شريط برأس داكن: تجميع للتخطيط فقط ولا يضيف أي معنى (ملوَّن بلون الطبقة التي تنتمي إليها معظم مربعاته)</text><text class="av-keyh" x="24" y="795">الخط: كيف يرتبط مربعان، ويُقرأ من حيث يبدأ الخط إلى حيث ينتهي</text><path d="M34 811 L66 811" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="815">الخدمة: يخدم (يوفّر ما يحتاجه الطرف)</text><path d="M34 831 L66 831" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="82" y="835">الوصول: يقرأ البيانات أو يكتبها (يُبيّن السهم اتجاه البيانات)</text><path d="M34 851 L66 851" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="855">التدفّق: يمرّر شيئًا، كالمعلومات، إلى</text></g></svg>
