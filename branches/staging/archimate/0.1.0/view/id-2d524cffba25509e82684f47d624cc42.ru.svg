<g class="av-legend"><rect x="14" y="360" width="829" height="284" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="378">Ключ</text><text class="av-keyh" x="24" y="394">Цвет: к какой части архитектуры относится блок</text><rect x="24" y="403" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="414">Зачем: кто заинтересован (заинтересованные стороны), а также движущие силы, цели, результаты, ценности и требования</text><rect x="24" y="423" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="434">Стратегия: что организация способна делать (возможности) и с помощью чего (ресурсы, потоки ценности)</text><rect x="24" y="443" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="454">Бизнес: люди, роли и организации, выполняемые ими процессы и используемая ими информация</text><text class="av-keyh" x="24" y="474">Форма: к какому виду относится блок (его маленькая курсивная подпись называет точный вид)</text><polygon points="30,482 62,482 68,488 68,500 62,506 30,506 24,500 24,488" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="498">Срезанные углы: причина или цель, например заинтересованная сторона, цель, результат или ценность</text><rect x="24" y="512" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="528">Скруглённые углы: действие или способность, например возможность, процесс или функция</text><rect x="24" y="542" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="558">Прямые углы: нечто существующее, например система, роль или элемент данных</text><text class="av-keyh" x="24" y="584">Другие обозначения</text><rect x="24" y="591" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="596" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="604">Блок внутри другого блока: его часть</text><rect x="24" y="613" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="613" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="624">Полоса с тёмным заголовком: группировка только для компоновки, не несёт смысла (окрашена в цвет уровня, к которому относится большинство её блоков)</text></g></svg>
