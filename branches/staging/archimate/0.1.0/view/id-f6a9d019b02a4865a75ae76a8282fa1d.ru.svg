<g class="av-legend"><rect x="206" y="917" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="216" y="935">Ключ</text><text class="av-keyh" x="216" y="951">Цвет: к какой части архитектуры относится блок</text><rect x="216" y="960" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="274" y="971">Зачем: кто заинтересован (заинтересованные стороны), а также движущие силы, цели, результаты, ценности и требования</text><rect x="216" y="980" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="274" y="991">Стратегия: что организация способна делать (возможности) и с помощью чего (ресурсы, потоки ценности)</text><rect x="216" y="1000" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="274" y="1011">Бизнес: люди, роли и организации, выполняемые ими процессы и используемая ими информация</text><rect x="216" y="1020" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="274" y="1031">Программное обеспечение: системы и их части, предлагаемые ими сервисы и хранимые ими данные</text><rect x="216" y="1040" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="274" y="1051">Технологии: устройства, платформы и сети, на которых работает программное обеспечение</text><text class="av-keyh" x="216" y="1071">Форма: к какому виду относится блок (его маленькая курсивная подпись называет точный вид)</text><polygon points="222,1079 254,1079 260,1085 260,1097 254,1103 222,1103 216,1097 216,1085" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1095">Срезанные углы: причина или цель, например заинтересованная сторона, цель, результат или ценность</text><rect x="216" y="1109" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1125">Скруглённые углы: действие или способность, например возможность, процесс или функция</text><rect x="216" y="1139" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1155">Скруглённые концы: сервис, предлагаемый для использования другими</text><rect x="216" y="1169" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1185">Прямые углы: нечто существующее, например система, роль или элемент данных</text><text class="av-keyh" x="216" y="1211">Другие обозначения</text><rect x="216" y="1218" width="44" height="18" fill="#fff" stroke="#555"/><rect x="226" y="1223" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1231">Блок внутри другого блока: его часть</text><rect x="216" y="1240" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="216" y="1240" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="274" y="1251">Полоса с тёмным заголовком: группировка только для компоновки, не несёт смысла (окрашена в цвет уровня, к которому относится большинство её блоков)</text></g></svg>
