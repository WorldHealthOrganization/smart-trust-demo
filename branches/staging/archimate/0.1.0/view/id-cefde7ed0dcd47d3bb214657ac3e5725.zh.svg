<g class="av-legend"><rect x="614" y="461" width="705" height="274" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="624" y="479">键</text><text class="av-keyh" x="624" y="495">颜色：框属于架构的哪个部分</text><rect x="624" y="504" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="682" y="515">战略：组织能够做什么（能力）以及凭借什么（资源、价值流）</text><rect x="624" y="524" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="682" y="535">业务：人员、角色和组织，他们执行的流程及使用的信息</text><rect x="624" y="544" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="682" y="555">软件：系统及其部件、它们提供的服务以及保存的数据</text><text class="av-keyh" x="624" y="575">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><rect x="624" y="583" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="599">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="624" y="613" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="629">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="624" y="655">线：两个框之间的关系，从线的起点读向终点</text><path d="M634 671 L666 671" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="682" y="675">实现：使之成为现实，或达成</text><path d="M634 691 L666 691" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="682" y="695">访问：读取或写入数据（箭头表示数据流动的方向）</text><path d="M634 711 L666 711" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="682" y="715">关联：与之相关（无更具体的含义）</text></g></svg>
