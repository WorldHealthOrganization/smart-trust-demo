<g class="av-legend"><rect x="14" y="561" width="829" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="579">键</text><text class="av-keyh" x="24" y="595">颜色：框属于架构的哪个部分</text><rect x="24" y="604" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="615">业务：人员、角色和组织，他们执行的流程及使用的信息</text><rect x="24" y="624" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="635">软件：系统及其部件、它们提供的服务以及保存的数据</text><text class="av-keyh" x="24" y="655">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><rect x="24" y="663" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="679">圆端：服务，供他方使用</text><rect x="24" y="693" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="709">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="24" y="735">其他标记</text><rect x="24" y="742" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="747" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="755">一个框位于另一个框内：是其组成部分</text><rect x="24" y="764" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="764" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="775">带深色标题的区带：仅用于布局的分组，不增加含义（按其中大多数框所属的层着色）</text><text class="av-keyh" x="24" y="795">线：两个框之间的关系，从线的起点读向终点</text><path d="M34 811 L66 811" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="815">服务：服务于（提供终点所需之物）</text><path d="M34 831 L66 831" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="82" y="835">访问：读取或写入数据（箭头表示数据流动的方向）</text><path d="M34 851 L66 851" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="855">流：将某物（例如信息）传递给</text></g></svg>
