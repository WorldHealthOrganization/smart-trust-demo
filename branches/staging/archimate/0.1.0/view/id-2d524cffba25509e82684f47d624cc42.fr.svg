<g class="av-legend"><rect x="14" y="360" width="829" height="284" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="378">Clé</text><text class="av-keyh" x="24" y="394">Couleur : la partie de l’architecture à laquelle appartient une boîte</text><rect x="24" y="403" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="414">Pourquoi : qui est concerné (parties prenantes), ainsi que les moteurs, buts, résultats, valeurs et exigences</text><rect x="24" y="423" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="434">Stratégie : ce que l’organisation est capable de faire (capacités) et avec quoi (ressources, chaînes de valeur)</text><rect x="24" y="443" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="454">Métier : les personnes, les rôles et les organisations, les processus qu’ils mènent et les informations qu’ils utilisent</text><text class="av-keyh" x="24" y="474">Forme : le type de chose qu’est une boîte (sa petite étiquette en italique nomme le type exact)</text><polygon points="30,482 62,482 68,488 68,500 62,506 30,506 24,500 24,488" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="498">Coins coupés : une raison ou une finalité, comme une partie prenante, un but, un résultat ou une valeur</text><rect x="24" y="512" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="528">Coins arrondis : une action ou une aptitude, comme une capacité, un processus ou une fonction</text><rect x="24" y="542" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="558">Coins droits : quelque chose qui existe, comme un système, un rôle ou une donnée</text><text class="av-keyh" x="24" y="584">Autres symboles</text><rect x="24" y="591" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="596" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="604">Une boîte dans une autre boîte : une partie de celle-ci</text><rect x="24" y="613" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="613" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="624">Bande à en-tête sombre : un regroupement pour la mise en page uniquement ; il n’ajoute aucune signification (teinté selon la couche à laquelle appartiennent la plupart de ses boîtes)</text></g></svg>
