<g class="av-legend"><rect x="14" y="695" width="829" height="384" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="713">键</text><text class="av-keyh" x="24" y="729">颜色：框属于架构的哪个部分</text><rect x="24" y="738" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="749">为何：谁关心（利益相关方），以及驱动因素、目标、成果、价值和要求</text><rect x="24" y="758" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="769">战略：组织能够做什么（能力）以及凭借什么（资源、价值流）</text><rect x="24" y="778" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="789">业务：人员、角色和组织，他们执行的流程及使用的信息</text><rect x="24" y="798" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="809">软件：系统及其部件、它们提供的服务以及保存的数据</text><text class="av-keyh" x="24" y="829">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><polygon points="30,837 62,837 68,843 68,855 62,861 30,861 24,855 24,843" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="853">切角：原因或目标，例如利益相关方、目标、成果或价值</text><rect x="24" y="867" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="883">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="24" y="897" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="913">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="24" y="939">其他标记</text><rect x="24" y="946" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="951" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="959">一个框位于另一个框内：是其组成部分</text><rect x="24" y="968" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="968" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="979">带深色标题的区带：仅用于布局的分组，不增加含义（按其中大多数框所属的层着色）</text><text class="av-keyh" x="24" y="999">线：两个框之间的关系，从线的起点读向终点</text><path d="M34 1015 L66 1015" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="1019">实现：使之成为现实，或达成</text><path d="M34 1035 L66 1035" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="82" y="1039">访问：读取或写入数据（箭头表示数据流动的方向）</text><path d="M34 1055 L66 1055" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="82" y="1059">关联：与之相关（无更具体的含义）</text></g></svg>
