<g class="av-legend"><rect x="194" y="947" width="705" height="424" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="204" y="965">Clave</text><text class="av-keyh" x="204" y="981">Color: a qué parte de la arquitectura pertenece una caja</text><rect x="204" y="990" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="262" y="1001">Estrategia: lo que la organización es capaz de hacer (capacidades) y con qué (recursos, flujos de valor)</text><rect x="204" y="1010" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="262" y="1021">Software: los sistemas y sus partes, los servicios que ofrecen y los datos que guardan</text><rect x="204" y="1030" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="262" y="1041">Tecnología: los dispositivos, plataformas y redes en los que funciona el software</text><text class="av-keyh" x="204" y="1061">Forma: qué tipo de cosa es una caja (su pequeña etiqueta en cursiva nombra el tipo exacto)</text><rect x="204" y="1069" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1085">Esquinas redondeadas: algo que se hace o una aptitud, como una capacidad, un proceso o una función</text><rect x="204" y="1099" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1115">Extremos redondeados: un servicio, ofrecido para que otros lo usen</text><rect x="204" y="1129" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1145">Esquinas rectas: algo que existe, como un sistema, un rol o un dato</text><text class="av-keyh" x="204" y="1171">Otras marcas</text><rect x="204" y="1178" width="44" height="18" fill="#fff" stroke="#555"/><rect x="214" y="1183" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="1191">Una caja dentro de otra caja: una parte de ella</text><text class="av-keyh" x="204" y="1211">Línea: cómo se relacionan dos cajas, leída desde donde empieza la línea hasta donde termina</text><path d="M214 1227 L246 1227" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1231">Realización: hace real, o logra</text><path d="M214 1247 L246 1247" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="262" y="1251">Servicio: sirve a (proporciona lo que el extremo necesita)</text><path d="M214 1267 L246 1267" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-filled)"/><text class="av-key" x="262" y="1271">Composición: está formado por (el extremo es una parte que no puede existir sin el origen)</text><path d="M214 1287 L246 1287" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#diamond-hollow)"/><text class="av-key" x="262" y="1291">Agregación: agrupa (el extremo es una parte que también puede existir por sí sola)</text><path d="M214 1307 L246 1307" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="262" y="1311">Acceso: lee o escribe datos (la flecha indica en qué dirección van los datos)</text><path d="M214 1327 L246 1327" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1331">Especialización: es un tipo de</text><path d="M214 1347 L246 1347" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="262" y="1351">Asociación: está relacionado con (sin un significado más específico)</text></g></svg>
