<g class="av-legend"><rect x="230" y="575" width="698" height="314" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="240" y="593">المفتاح</text><text class="av-keyh" x="240" y="609">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="240" y="618" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="298" y="629">الأعمال: الأشخاص والأدوار والمؤسسات، والعمليات التي يؤدّونها والمعلومات التي يستخدمونها</text><rect x="240" y="638" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="298" y="649">البرمجيات: الأنظمة وأجزاؤها، والخدمات التي تقدّمها، والبيانات التي تحتفظ بها</text><text class="av-keyh" x="240" y="669">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><rect x="240" y="677" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="693">الزوايا المستديرة: شيء يُنجَز أو قدرة، مثل القدرة أو العملية أو الوظيفة</text><rect x="240" y="707" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="723">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="240" y="749">علامات أخرى</text><rect x="240" y="756" width="44" height="18" fill="#fff" stroke="#555"/><rect x="250" y="761" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="298" y="769">مربع داخل مربع آخر: جزء منه</text><text class="av-keyh" x="240" y="789">الخط: كيف يرتبط مربعان، ويُقرأ من حيث يبدأ الخط إلى حيث ينتهي</text><path d="M250 805 L282 805" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="298" y="809">التحقيق: يجعله حقيقيًا، أو يحقّقه</text><path d="M250 825 L282 825" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="298" y="829">الخدمة: يخدم (يوفّر ما يحتاجه الطرف)</text><path d="M250 845 L282 845" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="849">الإسناد: مُسنَد إليه، أو يؤدّيه</text><path d="M250 865 L282 865" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-filled)"/><text class="av-key" x="298" y="869">الإطلاق: يُطلِق (يحدث أولًا، ويبدأ الطرف)</text></g></svg>
