<g class="av-legend"><rect x="14" y="360" width="829" height="284" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="378">المفتاح</text><text class="av-keyh" x="24" y="394">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="24" y="403" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="82" y="414">لماذا: من يهتم (أصحاب المصلحة)، والدوافع، والأهداف، والنتائج، والقيم، والمتطلبات</text><rect x="24" y="423" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="434">الاستراتيجية: ما تستطيع المؤسسة فعله (القدرات) وبماذا (الموارد، وسلاسل القيمة)</text><rect x="24" y="443" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="454">الأعمال: الأشخاص والأدوار والمؤسسات، والعمليات التي يؤدّونها والمعلومات التي يستخدمونها</text><text class="av-keyh" x="24" y="474">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><polygon points="30,482 62,482 68,488 68,500 62,506 30,506 24,500 24,488" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="498">الزوايا المقطوعة: سبب أو غاية، مثل صاحب مصلحة أو هدف أو نتيجة أو قيمة</text><rect x="24" y="512" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="528">الزوايا المستديرة: شيء يُنجَز أو قدرة، مثل القدرة أو العملية أو الوظيفة</text><rect x="24" y="542" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="558">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="24" y="584">علامات أخرى</text><rect x="24" y="591" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="596" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="604">مربع داخل مربع آخر: جزء منه</text><rect x="24" y="613" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="613" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="624">شريط برأس داكن: تجميع للتخطيط فقط ولا يضيف أي معنى (ملوَّن بلون الطبقة التي تنتمي إليها معظم مربعاته)</text></g></svg>
