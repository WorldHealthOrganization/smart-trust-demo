<g class="av-legend"><rect x="14" y="968" width="829" height="374" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="986">المفتاح</text><text class="av-keyh" x="24" y="1002">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="24" y="1011" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="1022">الاستراتيجية: ما تستطيع المؤسسة فعله (القدرات) وبماذا (الموارد، وسلاسل القيمة)</text><rect x="24" y="1031" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="1042">الأعمال: الأشخاص والأدوار والمؤسسات، والعمليات التي يؤدّونها والمعلومات التي يستخدمونها</text><rect x="24" y="1051" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="1062">البرمجيات: الأنظمة وأجزاؤها، والخدمات التي تقدّمها، والبيانات التي تحتفظ بها</text><text class="av-keyh" x="24" y="1082">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><rect x="24" y="1090" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="1106">الزوايا المستديرة: شيء يُنجَز أو قدرة، مثل القدرة أو العملية أو الوظيفة</text><rect x="24" y="1120" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="1136">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="24" y="1162">علامات أخرى</text><rect x="24" y="1169" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="1174" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="1182">مربع داخل مربع آخر: جزء منه</text><rect x="24" y="1191" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="1191" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="1202">شريط برأس داكن: تجميع للتخطيط فقط ولا يضيف أي معنى (ملوَّن بلون الطبقة التي تنتمي إليها معظم مربعاته)</text><text class="av-keyh" x="24" y="1222">الخط: كيف يرتبط مربعان، ويُقرأ من حيث يبدأ الخط إلى حيث ينتهي</text><path d="M34 1238 L66 1238" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="1242">التحقيق: يجعله حقيقيًا، أو يحقّقه</text><path d="M34 1258 L66 1258" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="1262">الخدمة: يخدم (يوفّر ما يحتاجه الطرف)</text><path d="M34 1278 L66 1278" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="1282">الإسناد: مُسنَد إليه، أو يؤدّيه</text><path d="M34 1298 L66 1298" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="1302">التدفّق: يمرّر شيئًا، كالمعلومات، إلى</text><path d="M34 1318 L66 1318" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="1322">التخصيص: نوع من</text></g></svg>
