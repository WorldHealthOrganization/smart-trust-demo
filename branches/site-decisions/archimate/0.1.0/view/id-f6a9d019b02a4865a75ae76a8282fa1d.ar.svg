<g class="av-legend"><rect x="206" y="917" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="216" y="935">المفتاح</text><text class="av-keyh" x="216" y="951">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="216" y="960" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="274" y="971">لماذا: من يهتم (أصحاب المصلحة)، والدوافع، والأهداف، والنتائج، والقيم، والمتطلبات</text><rect x="216" y="980" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="274" y="991">الاستراتيجية: ما تستطيع المؤسسة فعله (القدرات) وبماذا (الموارد، وسلاسل القيمة)</text><rect x="216" y="1000" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="274" y="1011">الأعمال: الأشخاص والأدوار والمؤسسات، والعمليات التي يؤدّونها والمعلومات التي يستخدمونها</text><rect x="216" y="1020" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="274" y="1031">البرمجيات: الأنظمة وأجزاؤها، والخدمات التي تقدّمها، والبيانات التي تحتفظ بها</text><rect x="216" y="1040" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="274" y="1051">التقنية: الأجهزة والمنصات والشبكات التي تعمل عليها البرمجيات</text><text class="av-keyh" x="216" y="1071">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><polygon points="222,1079 254,1079 260,1085 260,1097 254,1103 222,1103 216,1097 216,1085" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1095">الزوايا المقطوعة: سبب أو غاية، مثل صاحب مصلحة أو هدف أو نتيجة أو قيمة</text><rect x="216" y="1109" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1125">الزوايا المستديرة: شيء يُنجَز أو قدرة، مثل القدرة أو العملية أو الوظيفة</text><rect x="216" y="1139" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1155">الأطراف المستديرة: خدمة مُقدَّمة ليستخدمها الآخرون</text><rect x="216" y="1169" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1185">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="216" y="1211">علامات أخرى</text><rect x="216" y="1218" width="44" height="18" fill="#fff" stroke="#555"/><rect x="226" y="1223" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1231">مربع داخل مربع آخر: جزء منه</text><rect x="216" y="1240" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="216" y="1240" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="274" y="1251">شريط برأس داكن: تجميع للتخطيط فقط ولا يضيف أي معنى (ملوَّن بلون الطبقة التي تنتمي إليها معظم مربعاته)</text></g></svg>
