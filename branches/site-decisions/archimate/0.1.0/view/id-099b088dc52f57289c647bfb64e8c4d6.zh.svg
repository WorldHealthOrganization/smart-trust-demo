<g class="av-legend"><rect x="14" y="968" width="829" height="374" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="986">键</text><text class="av-keyh" x="24" y="1002">颜色：框属于架构的哪个部分</text><rect x="24" y="1011" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="1022">战略：组织能够做什么（能力）以及凭借什么（资源、价值流）</text><rect x="24" y="1031" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="1042">业务：人员、角色和组织，他们执行的流程及使用的信息</text><rect x="24" y="1051" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="1062">软件：系统及其部件、它们提供的服务以及保存的数据</text><text class="av-keyh" x="24" y="1082">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><rect x="24" y="1090" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="1106">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="24" y="1120" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="1136">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="24" y="1162">其他标记</text><rect x="24" y="1169" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="1174" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="1182">一个框位于另一个框内：是其组成部分</text><rect x="24" y="1191" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="1191" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="1202">带深色标题的区带：仅用于布局的分组，不增加含义（按其中大多数框所属的层着色）</text><text class="av-keyh" x="24" y="1222">线：两个框之间的关系，从线的起点读向终点</text><path d="M34 1238 L66 1238" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="1242">实现：使之成为现实，或达成</text><path d="M34 1258 L66 1258" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="1262">服务：服务于（提供终点所需之物）</text><path d="M34 1278 L66 1278" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="1282">分配：被分配给，或执行</text><path d="M34 1298 L66 1298" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="1302">流：将某物（例如信息）传递给</text><path d="M34 1318 L66 1318" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="1322">特化：是……的一种</text></g></svg>
