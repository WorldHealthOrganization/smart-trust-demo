<g class="av-legend"><rect x="614" y="461" width="705" height="274" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="624" y="479">Clave</text><text class="av-keyh" x="624" y="495">Color: a qué parte de la arquitectura pertenece una caja</text><rect x="624" y="504" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="682" y="515">Estrategia: lo que la organización es capaz de hacer (capacidades) y con qué (recursos, flujos de valor)</text><rect x="624" y="524" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="682" y="535">Negocio: personas, roles y organizaciones, los procesos que llevan a cabo y la información que usan</text><rect x="624" y="544" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="682" y="555">Software: los sistemas y sus partes, los servicios que ofrecen y los datos que guardan</text><text class="av-keyh" x="624" y="575">Forma: qué tipo de cosa es una caja (su pequeña etiqueta en cursiva nombra el tipo exacto)</text><rect x="624" y="583" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="599">Esquinas redondeadas: algo que se hace o una aptitud, como una capacidad, un proceso o una función</text><rect x="624" y="613" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="682" y="629">Esquinas rectas: algo que existe, como un sistema, un rol o un dato</text><text class="av-keyh" x="624" y="655">Línea: cómo se relacionan dos cajas, leída desde donde empieza la línea hasta donde termina</text><path d="M634 671 L666 671" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="682" y="675">Realización: hace real, o logra</text><path d="M634 691 L666 691" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="682" y="695">Acceso: lee o escribe datos (la flecha indica en qué dirección van los datos)</text><path d="M634 711 L666 711" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="682" y="715">Asociación: está relacionado con (sin un significado más específico)</text></g></svg>
