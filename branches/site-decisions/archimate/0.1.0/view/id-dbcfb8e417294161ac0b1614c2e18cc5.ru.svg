<g class="av-legend"><rect x="254" y="851" width="705" height="344" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="264" y="869">Ключ</text><text class="av-keyh" x="264" y="885">Цвет: к какой части архитектуры относится блок</text><rect x="264" y="894" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="322" y="905">Стратегия: что организация способна делать (возможности) и с помощью чего (ресурсы, потоки ценности)</text><rect x="264" y="914" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="322" y="925">Бизнес: люди, роли и организации, выполняемые ими процессы и используемая ими информация</text><rect x="264" y="934" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="322" y="945">Программное обеспечение: системы и их части, предлагаемые ими сервисы и хранимые ими данные</text><text class="av-keyh" x="264" y="965">Форма: к какому виду относится блок (его маленькая курсивная подпись называет точный вид)</text><rect x="264" y="973" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="989">Скруглённые углы: действие или способность, например возможность, процесс или функция</text><rect x="264" y="1003" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="1019">Скруглённые концы: сервис, предлагаемый для использования другими</text><rect x="264" y="1033" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="1049">Прямые углы: нечто существующее, например система, роль или элемент данных</text><text class="av-keyh" x="264" y="1075">Другие обозначения</text><rect x="264" y="1082" width="44" height="18" fill="#fff" stroke="#555"/><rect x="274" y="1087" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="322" y="1095">Блок внутри другого блока: его часть</text><text class="av-keyh" x="264" y="1115">Линия: как связаны два блока; читается от начала линии к её концу</text><path d="M274 1131 L306 1131" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="322" y="1135">Реализация: делает реальным или достигает</text><path d="M274 1151 L306 1151" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow-small)"/><text class="av-key" x="322" y="1155">Доступ: чтение или запись данных (стрелка показывает направление движения данных)</text><path d="M274 1171 L306 1171" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="322" y="1175">Ассоциация: связан с (без более конкретного значения)</text></g></svg>
