<g class="av-legend"><rect x="314" y="527" width="660" height="264" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="324" y="545">键</text><text class="av-keyh" x="324" y="561">颜色：框属于架构的哪个部分</text><rect x="324" y="570" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="382" y="581">软件：系统及其部件、它们提供的服务以及保存的数据</text><text class="av-keyh" x="324" y="601">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><rect x="324" y="609" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="382" y="625">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="324" y="639" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="382" y="655">圆端：服务，供他方使用</text><rect x="324" y="669" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="382" y="685">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="324" y="711">线：两个框之间的关系，从线的起点读向终点</text><path d="M334 727 L366 727" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="382" y="731">实现：使之成为现实，或达成</text><path d="M334 747 L366 747" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="382" y="751">服务：服务于（提供终点所需之物）</text><path d="M334 767 L366 767" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="382" y="771">分配：被分配给，或执行</text></g></svg>
