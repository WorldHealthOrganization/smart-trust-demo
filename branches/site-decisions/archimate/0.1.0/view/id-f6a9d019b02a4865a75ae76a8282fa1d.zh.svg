<g class="av-legend"><rect x="206" y="917" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="216" y="935">键</text><text class="av-keyh" x="216" y="951">颜色：框属于架构的哪个部分</text><rect x="216" y="960" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="274" y="971">为何：谁关心（利益相关方），以及驱动因素、目标、成果、价值和要求</text><rect x="216" y="980" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="274" y="991">战略：组织能够做什么（能力）以及凭借什么（资源、价值流）</text><rect x="216" y="1000" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="274" y="1011">业务：人员、角色和组织，他们执行的流程及使用的信息</text><rect x="216" y="1020" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="274" y="1031">软件：系统及其部件、它们提供的服务以及保存的数据</text><rect x="216" y="1040" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="274" y="1051">技术：软件运行所依托的设备、平台和网络</text><text class="av-keyh" x="216" y="1071">形状：框是哪一类事物（其斜体小标签注明确切类型）</text><polygon points="222,1079 254,1079 260,1085 260,1097 254,1103 222,1103 216,1097 216,1085" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1095">切角：原因或目标，例如利益相关方、目标、成果或价值</text><rect x="216" y="1109" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1125">圆角：所做之事或一种能力，例如能力、流程或功能</text><rect x="216" y="1139" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1155">圆端：服务，供他方使用</text><rect x="216" y="1169" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1185">直角：存在之物，例如系统、角色或一项数据</text><text class="av-keyh" x="216" y="1211">其他标记</text><rect x="216" y="1218" width="44" height="18" fill="#fff" stroke="#555"/><rect x="226" y="1223" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1231">一个框位于另一个框内：是其组成部分</text><rect x="216" y="1240" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="216" y="1240" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="274" y="1251">带深色标题的区带：仅用于布局的分组，不增加含义（按其中大多数框所属的层着色）</text></g></svg>
