<g class="av-legend"><rect x="194" y="743" width="829" height="374" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="204" y="761">المفتاح</text><text class="av-keyh" x="204" y="777">اللون: الجزء من البنية الذي ينتمي إليه المربع</text><rect x="204" y="786" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="262" y="797">الاستراتيجية: ما تستطيع المؤسسة فعله (القدرات) وبماذا (الموارد، وسلاسل القيمة)</text><rect x="204" y="806" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="262" y="817">الأعمال: الأشخاص والأدوار والمؤسسات، والعمليات التي يؤدّونها والمعلومات التي يستخدمونها</text><rect x="204" y="826" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="262" y="837">البرمجيات: الأنظمة وأجزاؤها، والخدمات التي تقدّمها، والبيانات التي تحتفظ بها</text><rect x="204" y="846" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="262" y="857">التقنية: الأجهزة والمنصات والشبكات التي تعمل عليها البرمجيات</text><text class="av-keyh" x="204" y="877">الشكل: نوع الشيء الذي يمثّله المربع (تُسمّي تسميته الصغيرة المائلة النوع بالضبط)</text><rect x="204" y="885" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="901">الزوايا المستديرة: شيء يُنجَز أو قدرة، مثل القدرة أو العملية أو الوظيفة</text><rect x="204" y="915" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="931">الزوايا القائمة: شيء موجود، مثل نظام أو دور أو جزء من البيانات</text><text class="av-keyh" x="204" y="957">علامات أخرى</text><rect x="204" y="964" width="44" height="18" fill="#fff" stroke="#555"/><rect x="214" y="969" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="262" y="977">مربع داخل مربع آخر: جزء منه</text><rect x="204" y="986" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="204" y="986" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="262" y="997">شريط برأس داكن: تجميع للتخطيط فقط ولا يضيف أي معنى (ملوَّن بلون الطبقة التي تنتمي إليها معظم مربعاته)</text><text class="av-keyh" x="204" y="1017">الخط: كيف يرتبط مربعان، ويُقرأ من حيث يبدأ الخط إلى حيث ينتهي</text><path d="M214 1033 L246 1033" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1037">التحقيق: يجعله حقيقيًا، أو يحقّقه</text><path d="M214 1053 L246 1053" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="8 4" marker-end="url(#arrow-filled)"/><text class="av-key" x="262" y="1057">التدفّق: يمرّر شيئًا، كالمعلومات، إلى</text><path d="M214 1073 L246 1073" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="262" y="1077">التخصيص: نوع من</text><path d="M214 1093 L246 1093" fill="none" stroke="#333" stroke-width="1.2"/><text class="av-key" x="262" y="1097">الارتباط: مرتبط به (دون معنى أكثر تحديدًا)</text></g></svg>
