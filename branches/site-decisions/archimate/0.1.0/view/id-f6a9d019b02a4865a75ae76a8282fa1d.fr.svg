<g class="av-legend"><rect x="206" y="917" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="216" y="935">Clé</text><text class="av-keyh" x="216" y="951">Couleur : la partie de l’architecture à laquelle appartient une boîte</text><rect x="216" y="960" width="44" height="14" fill="#ccccff" stroke="#70708c"/><text class="av-key" x="274" y="971">Pourquoi : qui est concerné (parties prenantes), ainsi que les moteurs, buts, résultats, valeurs et exigences</text><rect x="216" y="980" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="274" y="991">Stratégie : ce que l’organisation est capable de faire (capacités) et avec quoi (ressources, chaînes de valeur)</text><rect x="216" y="1000" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="274" y="1011">Métier : les personnes, les rôles et les organisations, les processus qu’ils mènent et les informations qu’ils utilisent</text><rect x="216" y="1020" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="274" y="1031">Logiciel : les systèmes et leurs parties, les services qu’ils offrent et les données qu’ils détiennent</text><rect x="216" y="1040" width="44" height="14" fill="#c9e7b7" stroke="#6f7f65"/><text class="av-key" x="274" y="1051">Technologie : les appareils, plateformes et réseaux sur lesquels s’exécute le logiciel</text><text class="av-keyh" x="216" y="1071">Forme : le type de chose qu’est une boîte (sa petite étiquette en italique nomme le type exact)</text><polygon points="222,1079 254,1079 260,1085 260,1097 254,1103 222,1103 216,1097 216,1085" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1095">Coins coupés : une raison ou une finalité, comme une partie prenante, un but, un résultat ou une valeur</text><rect x="216" y="1109" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1125">Coins arrondis : une action ou une aptitude, comme une capacité, un processus ou une fonction</text><rect x="216" y="1139" width="44" height="24" rx="12" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1155">Extrémités arrondies : un service, offert à l’usage d’autres</text><rect x="216" y="1169" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1185">Coins droits : quelque chose qui existe, comme un système, un rôle ou une donnée</text><text class="av-keyh" x="216" y="1211">Autres symboles</text><rect x="216" y="1218" width="44" height="18" fill="#fff" stroke="#555"/><rect x="226" y="1223" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="274" y="1231">Une boîte dans une autre boîte : une partie de celle-ci</text><rect x="216" y="1240" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="216" y="1240" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="274" y="1251">Bande à en-tête sombre : un regroupement pour la mise en page uniquement ; il n’ajoute aucune signification (teinté selon la couche à laquelle appartiennent la plupart de ses boîtes)</text></g></svg>
